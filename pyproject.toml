[project]
name = "pixel-trigger"
version = "0.5.1"
description = "通用圖像觸發自動化工具"
requires-python = ">=3.12"
dependencies = [
    "opencv-python>=4.8.0",
    "pyautogui>=0.9.54",
    "mss>=9.0.0",
    "keyboard>=0.13.5",
    "numpy>=1.24.0",
    "Pillow>=10.0.0",
    "ttkbootstrap>=1.20,<2",
]

[project.scripts]
pixel-trigger = "main:main"

[dependency-groups]
dev = [
    "nuitka>=2.0",
    "ordered-set>=4.1.0",  # nuitka 依賴
    "pyinstaller>=6.22.3",
    "zstandard>=0.23.0",   # nuitka --onefile 壓縮
]
